<!DOCTYPE html>
<html>
     <head>
          <meta charset="utf-8">
          <title>Weather Forecast Statistics for Tyrone</title>
          <style>
               /* Change font */
               body {
                    font-family: Arial, sans-serif;
               }
               /* Add banner on top */
               .top-banner {
                    background-color: #333;
                    color: white;
                    padding: 10px;
                    text-align: center;
               }
               /* Add banner on bottom */
               .bottom-banner {
                    background-color: #333;
                    color: white;
                    padding: 10px;
                    text-align: center;
                    position: fixed;
                    bottom: 0;
                    left: 0;
                    width: 100%;
               }
               /* Add space for text in bottom banner */
               .bottom-banner p {
                    margin: 0;
               }
          </style>
     </head>
     <body>
          <div class="top-banner">
               <h1>Weather Forecast Statistics for Tyrone</h1>
          </div>
          <h2>Forecast By-Day</h2>
          <h3>Manipulated Data</h3>
          <p>{{table|safe}}</p>
          <p></p>
          <h3>Queried Data</h3>
          <p>{{sqlTable|safe}}</p>
          <div class="bottom-banner">
          </div>
     </body>
</html>
